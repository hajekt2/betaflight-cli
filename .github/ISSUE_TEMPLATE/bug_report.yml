name: Bug report
description: Report reproducible incorrect behavior in betaflight-cli
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, bind data, personal names, or unredacted configuration.
        Report security vulnerabilities privately through SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe command sequence that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version output
      description: Paste `betaflight-cli version` output.
      render: json
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: macOS 15 arm64, Windows 11 amd64, Ubuntu 24.04 amd64
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Betaflight firmware and target
      placeholder: Betaflight 2025.12.0, target name if relevant
  - type: dropdown
    id: safety
    attributes:
      label: Safety impact
      options:
        - Read-only or offline
        - Configuration write
        - Save, reboot, erase, bootloader, or firmware flashing
        - Motor, DShot, receiver override, or other physical action
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Redacted output
      description: Include structured errors and `--verbose` diagnostics when safe.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed private configuration and identifying values.
          required: true
        - label: I searched existing issues for duplicates.
          required: true
