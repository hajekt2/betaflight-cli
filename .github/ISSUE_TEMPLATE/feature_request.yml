name: Feature request
description: Propose a focused CLI workflow or compatibility improvement
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or agent workflow is currently difficult or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed command and contract
      description: Include example commands, JSON output roots, and failure behavior.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety model
      description: Explain reads, writes, confirmation, save behavior, and physical-action risks.
    validations:
      required: true
  - type: textarea
    id: upstream
    attributes:
      label: Upstream reference
      description: Link the exact Betaflight release source or Configurator workflow when relevant.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This remains a native CLI and does not add MCP runtime coupling.
          required: true
