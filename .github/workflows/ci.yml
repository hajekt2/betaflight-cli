name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      betaflight_src:
        description: "Optional checked-out Betaflight source path for metadata verification"
        required: false
        type: string

permissions:
  contents: read

env:
  GO_VERSION: "1.25.x"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify formatting
        run: |
          test -z "$(git ls-files '*.go' | xargs gofmt -l)"

      - name: Test
        run: make test

      - name: Check diff whitespace
        run: git diff --check

  release-build:
    name: Release Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build and verify release artifacts
        run: make build-release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: betaflight-cli-dist
          path: dist/
          if-no-files-found: error

  verify-metadata:
    name: Verify Generated Metadata
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.betaflight_src != '' }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify metadata
        run: make verify-metadata BETAFLIGHT_SRC="${{ inputs.betaflight_src }}"
